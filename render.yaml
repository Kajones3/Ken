# Render Blueprint — deploys the API as a free web service.
# https://render.com/docs/blueprint-spec
#
# Render's own free Postgres expires after 30 days, so this deploys the app
# only; point DATABASE_URL (set in the Render dashboard, not here) at a free
# Neon project instead — see README.md's "Deploy for free" section.
services:
  - type: web
    name: parkfare
    runtime: node
    plan: free
    buildCommand: npm install && npm run migrate
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: TRAVELPAYOUTS_TOKEN
        sync: false
      - key: TRAVELPAYOUTS_MARKER
        sync: false
      - key: RESEND_API_KEY
        sync: false
      # Set in the dashboard, not here. Resend will not send from a domain
      # you have not verified, and until you verify one the only address
      # that works is onboarding@resend.dev — so a hardcoded parkfare.app
      # here would make every verification email fail on a new account.
      - key: ALERT_FROM_EMAIL
        sync: false
      # Where confirmation links point. Unset gives a RELATIVE link, which
      # works in a local dev loop and is useless inside a real email.
      - key: PUBLIC_BASE_URL
        sync: false
      # Leave unset until a confirmation link has actually arrived in an
      # inbox. "true" stops an unconfirmed address signing in at all — which
      # locks out every user, including the owner, if mail is not really
      # working yet. See src/verifyEmail.ts.
      - key: REQUIRE_VERIFIED_EMAIL
        sync: false
      - key: MAX_REQUESTS_PER_MINUTE
        value: "240"
      - key: ALERT_MAX_PER_USER_PER_DAY
        value: "3"
      - key: ALERT_ANOMALY_SHARE
        value: "0.4"
      - key: ALERT_ANOMALY_MOVE_PCT
        value: "25"
