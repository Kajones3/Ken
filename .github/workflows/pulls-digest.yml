name: Parkfare real-pulls digest

# Private, owner-only — emails a daily summary of which flight routes and
# which hotels a real provider actually returned prices for recently, so a
# quiet cache can't look healthy. Reads only; makes no provider calls.
# See src/jobs/pullsDigest.ts.
on:
  schedule:
    # 11:10 UTC — after the nightly refresh and popular-routes jobs have run,
    # so the digest reports the night that just finished, not the one before.
    - cron: "10 11 * * *"
  workflow_dispatch:
    inputs:
      window_days:
        description: "How many days back to report on"
        required: false
        default: "15"

jobs:
  pulls-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run pulls-digest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_FROM_EMAIL: ${{ secrets.ALERT_FROM_EMAIL }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          PULLS_WINDOW_DAYS: ${{ inputs.window_days || '15' }}
