name: Pricing the Magic port weather

# Regenerates src/portClimateData.ts — typical weather at Disney Cruise Line's
# home ports and ports of call — from Open-Meteo ERA5 observations, the same
# way the parks' weather is made (climate-normals.yml). Manual: normals move
# once a decade. No secrets.
on:
  workflow_dispatch:
    inputs:
      years:
        description: "Years of history to average (20 is a good default; 10 costs half as much if the API budget is tight)"
        required: false
        default: "20"

permissions:
  # To commit the regenerated table back. Nothing else.
  contents: write

jobs:
  port-weather:
    runs-on: ubuntu-latest
    # Open-Meteo's free allowance is per minute, so the job paces itself and
    # waits out any ceiling it meets. Expect minutes, not seconds. The timeout
    # is here so a genuinely stuck run ends by itself rather than sitting on a
    # runner — it is not a target.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci

      - name: Fetch observations and regenerate the table
        run: npm run port-climate
        env:
          CLIMATE_YEARS: ${{ inputs.years }}

      # The generated file must still compile and still satisfy the climate
      # tests (twelve months, high above low, wet seasons in the right months).
      # A run that produces a table the app rejects has not succeeded, and
      # committing it would break the board for everyone.
      - name: Check the regenerated table
        run: |
          npm run typecheck
          npx tsx --test src/jobs/portClimate.test.ts

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- src/portClimateData.ts; then
            echo "No change — the observations still agree with the committed table."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/portClimateData.ts
          git commit -m "Regenerate port weather from observations"
          git push
          echo "### Port weather updated" >> "$GITHUB_STEP_SUMMARY"
          echo '```diff' >> "$GITHUB_STEP_SUMMARY"
          git show --stat --format= HEAD >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
