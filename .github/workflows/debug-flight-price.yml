name: Parkfare debug flight price

# One-off diagnostic: hits an arbitrary Travelpayouts endpoint/query and
# dumps the raw response, so a suspicious cached price (or a candidate
# replacement endpoint) can be checked against what the provider actually
# returns, not just what our parsing code assumed. Manual only, no
# database or app code touched.
on:
  workflow_dispatch:
    inputs:
      path:
        description: API path, e.g. /v1/prices/calendar or /v2/prices/latest
        required: true
        type: string
        default: "/v1/prices/calendar"
      query:
        description: >-
          Query string (no leading ?, no token — that's added automatically).
          e.g. origin=ATL&destination=PVG&depart_date=2027-03&currency=usd&calendar_type=departure_date&trip_duration=4
        required: true
        type: string
        default: "origin=ATL&destination=PVG&depart_date=2027-03&currency=usd&calendar_type=departure_date&trip_duration=4"

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Query Travelpayouts
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
        run: |
          curl -sS "https://api.travelpayouts.com${{ inputs.path }}?${{ inputs.query }}&token=${TRAVELPAYOUTS_TOKEN}" | python3 -m json.tool
