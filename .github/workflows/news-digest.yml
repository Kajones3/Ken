name: Parkfare news digest

# Private, owner-only — checks a handful of Disney-fan-news RSS feeds
# (NEWS_FEEDS in config.ts) and emails whatever's new. Never surfaces
# anything to end users automatically; see src/jobs/newsDigest.ts.
on:
  schedule:
    - cron: "40 4 * * *"
  workflow_dispatch: {}

jobs:
  news-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run news-digest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_FROM_EMAIL: ${{ secrets.ALERT_FROM_EMAIL }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
