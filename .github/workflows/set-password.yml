name: Parkfare set password

# Manual only — sets (or clears) the sign-in credential on one account in the
# same production database the site uses. Same mechanism as running
# `npm run set-password -- email 'value'` locally, just runnable from the
# Actions tab without a Neon connection string on hand.
#
# The value is typed into the run form, never committed to this repo: a
# secret in a git history is a secret everyone with that history has,
# forever, including after it is changed. GitHub does not mask workflow
# inputs, so the value is visible to anyone who can read this repository's
# Actions runs — for this repo, its owner. Pass --clear to go back to
# email-only sign-in. See src/setPassword.ts.
on:
  workflow_dispatch:
    inputs:
      email:
        description: Account email
        required: true
        type: string
      secret:
        description: New sign-in value, or --clear to remove it
        required: true
        type: string

jobs:
  set-password:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run set-password -- "${{ inputs.email }}" "${{ inputs.secret }}"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
