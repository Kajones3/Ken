name: Parkfare refresh

# Tiered per CLAUDE.md: this is the once-a-morning cache refresh. It talks to
# the same Neon database the deployed app reads from — the DATABASE_URL
# secret here must match the one set in the Render dashboard.
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: >-
          Full one-time backfill (every month in the refresh window, not
          just today's due tier). Use this the first time you deploy, or
          any time the cache looks thin — the normal daily run only fills
          in whichever tier is due that day.
        type: boolean
        default: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run refresh
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TRAVELPAYOUTS_MARKER: ${{ secrets.TRAVELPAYOUTS_MARKER }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          MAX_REQUESTS_PER_MINUTE: "240"
          # Hard ceiling on paid off-property hotel lookups for this run.
          # Sized for SerpApi Starter (1,000 searches/month): 8 a night is
          # ~240/month, leaving room for the nightly flight rotation (~300)
          # and exact-fare (~180). An exhausted budget degrades off-property
          # to cached rates; on-property is local and unaffected.
          # Raise this temporarily for a REFRESH_BACKFILL run, which wants
          # ~150 in one go.
          SERPAPI_HOTELS_BUDGET: ${{ vars.SERPAPI_HOTELS_BUDGET || '8' }}
          REFRESH_BACKFILL: ${{ inputs.backfill }}
          FARE_TREND_SOURCES: ${{ vars.FARE_TREND_SOURCES || 'serpapi_flights' }}
