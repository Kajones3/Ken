name: Parkfare alerts

# Runs twice a day (04:20 and 16:20 UTC) so Plus users' saved trips get
# checked more often than the once-daily flight/hotel cache refresh — the
# second run won't find new prices for trips already checked that morning
# (the cache itself still only refreshes once a day), but it does mean a
# trip saved mid-day gets its first check the same day instead of waiting
# until tomorrow, and any alert whose email failed to send gets retried
# sooner. Never calls a provider itself — see src/jobs/alerts.ts.
on:
  schedule:
    - cron: "20 4 * * *"
    - cron: "20 16 * * *"
  workflow_dispatch: {}

jobs:
  alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run alerts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_FROM_EMAIL: ${{ secrets.ALERT_FROM_EMAIL }}
          ALERT_MAX_PER_USER_PER_DAY: "3"
          ALERT_ANOMALY_SHARE: "0.4"
          ALERT_ANOMALY_MOVE_PCT: "25"
          ALERT_GAS_MOVE_PCT: "8"
