name: Pricing the Magic debug DB1B

# One-off diagnostic: downloads one real BTS DB1B Market quarterly file,
# unzips it, and shows the CSV header plus a few sample rows for routes we
# care about (MCO, SNA) — so a real parser can be written against the
# actual column names instead of guessing. Manual only, no database or
# app code touched. The file is deleted at the end of the job either way.
on:
  workflow_dispatch:
    inputs:
      year:
        required: true
        type: string
        default: "2024"
      quarter:
        required: true
        type: string
        default: "4"
      grep_for:
        description: Airport code to filter sample rows on (e.g. MCO, SNA)
        required: true
        type: string
        default: "MCO"
      origin:
        description: Route origin for the ticket-vs-market check (e.g. BNA)
        required: false
        type: string
        default: "BNA"
      dest:
        description: Route destination for the ticket-vs-market check (e.g. MCO)
        required: false
        type: string
        default: "MCO"
      db1c_probe:
        description: "yes = look for BTS's new MONTHLY DB1C (OD40) files instead"
        required: false
        type: string
        default: "no"

jobs:
  # 2026-10-10: DB1B ended after 2025 Q2. BTS replaced it from July 2025 with
  # DB1C ("OD40"): monthly, a 40% sample. This finds the real file names and
  # columns so a loader is written against them, not a guess. No database.
  db1c:
    if: inputs.db1c_probe == 'yes'
    runs-on: ubuntu-latest
    steps:
      - name: Find and inspect DB1C files
        run: |
          set +e
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36"
          get() { curl -sSL --compressed -A "$UA" -H "Accept: text/html,application/xhtml+xml,*/*;q=0.8" -H "Accept-Language: en-US,en;q=0.9" "$1" -o "$2"; echo "  $1 -> exit $? size $(wc -c < "$2")"; }
          echo "=== the raw file directory ==="
          get "https://transtats.bts.gov/PREZIP/" dir.html
          sed 's/<br>/\n/g' dir.html | sed 's/<[^>]*>//g' > dir.txt
          echo "files in the directory: $(grep -c '\.zip' dir.txt)"
          echo "--- every file dated 2025 or 2026 ---"
          grep -E '^ *[0-9]+/[0-9]+/(2025|2026) ' dir.txt | grep -viE 'ONTIME|On_Time|Reporting_Carrier' | head -150
          echo "--- names with Origin, Survey, DB1, OD40, OD_ ---"
          grep -iE 'Origin|Survey|DB1|OD40|OD_' dir.txt | tail -40
          for page in \
            "https://www.bts.gov/topics/airlines-and-airports/origin-and-destination-survey-data-market" \
            "https://www.bts.gov/topics/airlines-and-airports/origin-and-destination-survey-data-product"; do
            echo "=== $page ==="
            get "$page" page.html
            head -c 470 page.html; echo
            grep -oiE 'href="[^"]*\.zip[^"]*"' page.html | sort -u | head -40
          done
          echo "=== TranStats pages that name DB1C (for the monthly Market/Coupon tables) ==="
          for u in "https://www.transtats.bts.gov/DataIndex.asp" \
                   "https://www.transtats.bts.gov/Tables.asp?QO_VQ=EGH" \
                   "https://www.transtats.bts.gov/DatabaseInfo.asp?QO_VQ=EGH"; do
            get "$u" t.html
            grep -oiE '<a[^>]*href="[^"]*"[^>]*>[^<]*(DB1C|Origin and Destination|O&amp;D|OD40)[^<]*</a>' t.html | head -20
            grep -oiE 'href="[^"]*(QO_VQ|gnoyr_VQ|Table_ID|DB_ID)=[^"]*"[^>]*>[^<]{0,80}' t.html | grep -iE 'DB1C|Origin|Market|Coupon|Ticket|OD' | head -30
          done
          echo "=== every DB1C file in the directory ==="
          grep -iE 'DB1C' dir.txt
          f=$(grep -oiE 'Origin_and_Destination_Survey_DB1C[A-Za-z]+_[0-9]+_[0-9]+\.zip' dir.txt | sort -u | tail -1)
          [ -n "$f" ] || { echo "none found by name"; exit 0; }
          echo "Fetching $f"
          curl -sSL -A "$UA" "https://transtats.bts.gov/PREZIP/$f" -o c.zip; ls -la c.zip; unzip -l c.zip
          inner=$(unzip -Z1 c.zip | grep -iE '\.csv$' | head -1)
          echo "--- header ---"; unzip -p c.zip "$inner" | head -1
          echo "--- first 3 rows ---"; unzip -p c.zip "$inner" | sed -n '2,4p'
          echo "--- rows, and rows by year/month/quarter columns if present ---"
          unzip -p c.zip "$inner" | awk -F',' '
            NR==1 { for (i=1;i<=NF;i++) { h=$i; gsub(/"/,"",h); c[h]=i } next }
            { n++; k=""; if ("Year" in c) k=k $c["Year"]; if ("Month" in c) k=k "-m" $c["Month"]; if ("Quarter" in c) k=k "-q" $c["Quarter"]; seen[k]++ }
            END { print n " rows"; for (k in seen) print "  " k ": " seen[k] }'
          echo "--- 5 rows with BNA ---"; unzip -p c.zip "$inner" | grep -m 5 '"BNA"'
          rm -rf c.zip *.html dir.txt

  debug:
    if: inputs.db1c_probe != 'yes'
    runs-on: ubuntu-latest
    steps:
      - name: Download and inspect
        run: |
          url="https://transtats.bts.gov/PREZIP/Origin_and_Destination_Survey_DB1BMarket_${{ inputs.year }}_${{ inputs.quarter }}.zip"
          echo "Fetching $url"
          curl -sSL "$url" -o db1b.zip
          ls -la db1b.zip
          unzip -o db1b.zip -d db1b_out
          csv=$(ls db1b_out/*.csv | head -1)
          echo "--- CSV file: $csv ---"
          echo "--- header ---"
          head -1 "$csv"
          echo "--- 5 sample rows containing ${{ inputs.grep_for }} ---"
          grep -m 5 "${{ inputs.grep_for }}" "$csv"
          echo "--- total row count ---"
          wc -l "$csv"

          # ------------------------------------------------------------------
          # IS MktFare ONE DIRECTION OR THE WHOLE ROUND TRIP?
          #
          # This is the question that matters, and `grep -m 5` above cannot
          # answer it: five arbitrary rows are five different itineraries.
          # You need BOTH rows of ONE itinerary, side by side.
          #
          # SETTLED 2026-09-28: MktFare is ONE LEG, and btsBaseline.ts now
          # doubles it. This section alone could not have settled it: equal
          # rows are what a round trip split in half by miles ALSO looks like
          # (the two directions are nearly the same distance). The ticket
          # join further down is what settled it. For the record, the old
          # argument "the fare trend sat near 1.0, so it can't be one leg"
          # was measuring against the CHEAPEST Google itinerary, which is
          # itself about half a typical fare.
          # ------------------------------------------------------------------
          echo ""
          echo "=== MktFare basis: every row of one round-trip itinerary ==="
          itin=$(awk -F',' -v code="\"${{ inputs.grep_for }}\"" '
            NR>1 && ($9==code || $18==code) { c[$1]++ }
            END { for (i in c) if (c[i]==2) { print i; exit } }
          ' "$csv")
          if [ -z "$itin" ]; then
            echo "No two-market itinerary found touching ${{ inputs.grep_for }}."
            echo "That is itself informative: it would mean round trips are NOT two rows."
          else
            echo "ItinID $itin — columns: ItinID, Origin, Dest, Passengers, MktFare"
            awk -F',' -v id="$itin" 'NR==1 || $1==id { print $1", "$9", "$18", "$34", "$35 }' "$csv"
            echo ""
            echo "Sum of MktFare across that itinerary's markets:"
            awk -F',' -v id="$itin" '$1==id { s+=$35 } END { printf "  $%.2f\n", s }' "$csv"
            echo "Rows split roughly by miles flown, adding up to the ticket: MktFare is one leg."
            echo "(Settled 2026-09-28 by the ticket join below; the loader doubles it.)"
          fi

          # ------------------------------------------------------------------
          # THE DEFINITIVE VERSION OF THE QUESTION ABOVE (added 2026-09-28).
          #
          # Two market rows carrying the same fare cannot settle it on their
          # own: a round trip split in half by miles ALSO gives two equal
          # rows. The DB1B Ticket file carries ItinFare, the price of the
          # whole ticket, and a RoundTrip flag. Join the two on ItinID:
          #   MktFare ~= ItinFare          -> MktFare is the whole trip.
          #   MktFare ~= ItinFare / 2      -> MktFare is one leg, and every
          #                                   domestic baseline is half.
          # Columns are found by header name, not position.
          # ------------------------------------------------------------------
          echo ""
          echo "=== Ticket vs market: ${{ inputs.origin }} -> ${{ inputs.dest }} ==="
          turl="https://transtats.bts.gov/PREZIP/Origin_and_Destination_Survey_DB1BTicket_${{ inputs.year }}_${{ inputs.quarter }}.zip"
          echo "Fetching $turl"
          curl -sSL "$turl" -o ticket.zip
          unzip -o ticket.zip -d ticket_out > /dev/null
          tcsv=$(ls ticket_out/*.csv | head -1)
          echo "--- ticket header ---"
          head -1 "$tcsv"

          # Every market row for the route: ItinID, MktFare, Passengers.
          awk -F',' -v o="${{ inputs.origin }}" -v d="${{ inputs.dest }}" '
            NR==1 { for (i=1;i<=NF;i++) { h=$i; gsub(/"/,"",h); c[h]=i } next }
            { og=$c["Origin"]; de=$c["Dest"]; gsub(/"/,"",og); gsub(/"/,"",de)
              if (og==o && de==d) { id=$c["ItinID"]; f=$c["MktFare"]; p=$c["Passengers"]
                gsub(/"/,"",id); gsub(/"/,"",f); gsub(/"/,"",p); print id","f","p } }
          ' "$csv" > route_markets.csv
          echo "Market rows for the route: $(wc -l < route_markets.csv)"

          # The same itineraries in the ticket file.
          awk -F',' '
            FNR==NR { m[$1]=$2; next }
            FNR==1 { for (i=1;i<=NF;i++) { h=$i; gsub(/"/,"",h); c[h]=i } next }
            { id=$c["ItinID"]; gsub(/"/,"",id)
              if (id in m) { f=$c["ItinFare"]; rt=$c["RoundTrip"]; gsub(/"/,"",f); gsub(/"/,"",rt)
                print id","m[id]","f","rt } }
          ' route_markets.csv "$tcsv" > joined.csv

          echo ""
          echo "First 15 itineraries: ItinID, MktFare, ItinFare (whole ticket), RoundTrip (1 = yes)"
          head -15 joined.csv
          echo ""
          echo "Round-trip tickets only, MktFare / ItinFare:"
          awk -F',' '$4==1 && $3>0 { r=$2/$3; n++; s+=r; if (r<0.6) half++; else if (r>0.9) whole++ }
            END { if (n) printf "  %d round-trip tickets, average ratio %.2f\n  near 0.5 (one leg): %d   near 1.0 (whole trip): %d\n", n, s/n, half, whole; else print "  none found" }' joined.csv
          echo "One-way tickets in the route's market rows:"
          awk -F',' '$4==0 { n++ } END { printf "  %d\n", n+0 }' joined.csv

          rm -rf db1b.zip db1b_out ticket.zip ticket_out route_markets.csv joined.csv
